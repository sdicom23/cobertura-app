<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cobertura AT&T</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#fff; --tx:#1d1d1f; --tx2:#5f5e5a; --bd:#e2e0d8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--tx); background:#ebe7df;
              -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; left:8px; right:8px; background:var(--bg); border:1px solid var(--bd); border-radius:12px; padding:8px 10px; z-index:2; font-size:12.5px; }
  .arriba { top:8px; } .abajo { bottom:8px; }
  .t { font-weight:600; font-size:14px; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .sub { color:var(--tx2); font-size:11.5px; }
  .fila { display:flex; gap:6px; flex-wrap:wrap; } .fila + .fila { margin-top:7px; }
  .btn { flex:1; border:1px solid var(--bd); background:var(--bg); color:var(--tx2); border-radius:8px; padding:7px 4px; font-size:12px; cursor:pointer; }
  .btn.on { background:#E6F1FB; color:#0C447C; border-color:#85B7EB; font-weight:600; }
  .ley { display:flex; align-items:center; gap:4px; font-size:11px; color:var(--tx2); }
  .sq { width:11px; height:11px; border-radius:2px; display:inline-block; vertical-align:-1px; }
  .tip { margin-top:6px; padding:6px 8px; background:#F3F1EA; border-radius:8px; font-size:11.5px; line-height:1.4; }
  .tip ul { margin:3px 0 0; padding-left:16px; }
  .barra { display:flex; height:7px; border-radius:4px; overflow:hidden; margin:5px 0 3px; background:#eee; }
  .ruta { display:none; gap:6px; margin-top:7px; } .ruta.on { display:flex; }
  .ruta input { flex:1; min-width:0; border:1px solid var(--bd); border-radius:8px; padding:7px; font-size:12px; -webkit-user-select:text; user-select:text; }
  #velo { position:absolute; inset:0; z-index:5; background:rgba(235,231,223,.92); display:none; align-items:center; justify-content:center; text-align:center; padding:30px; font-size:15px; line-height:1.5; }
  .mini { font-size:10.5px; color:#8a877f; margin-top:5px; }
  #info { max-height:38vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .oculto .panel { display:none; }
  .x { border:1px solid var(--bd); background:var(--bg); color:var(--tx2); border-radius:8px; padding:3px 8px; font-size:11.5px; cursor:pointer; }
  #verInfo { position:absolute; left:8px; bottom:10px; z-index:3; display:none; border:1px solid #85B7EB; background:#E6F1FB; color:#0C447C;
             border-radius:20px; padding:9px 14px; font-size:13px; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,.15); cursor:pointer; }
  .oculto #verInfo { display:block; }
</style>
</head>
<body>
<div id="map"></div>
<div id="velo"></div>
<button id="verInfo">📋 Ver información</button>

<div class="panel arriba">
  <div class="t"><span>Cobertura AT&T</span><span style="display:flex;gap:6px;align-items:center"><span class="sub" id="quien"></span><button class="x" id="bOcultar" title="Ocultar información">✖ Ocultar</button></span></div>
  <div id="info" class="sub">Cargando…</div>
</div>

<div class="panel abajo">
  <div class="fila" id="tecs"></div>
  <div class="fila" id="leyenda" style="margin-top:6px"></div>
  <div class="fila" style="margin-top:7px">
    <button class="btn" id="bRuta">🛣️ Ruta</button>
    <button class="btn" id="bYo">📍 Mi ubicación</button>
  </div>
  <div class="ruta" id="fRuta">
    <input id="iO" placeholder="Origen (ciudad o lat,lon)">
    <input id="iD" placeholder="Destino">
    <button class="btn" id="bIr" style="flex:0 0 46px">Ir</button>
  </div>
  <div class="mini">Cobertura estimada con datos CRT/AT&T 2026. Puede variar por equipo, antena, interiores o saturación. No constituye garantía de servicio.</div>
</div>

<script src="app.js?v=5"></script>
</body>
</html>
